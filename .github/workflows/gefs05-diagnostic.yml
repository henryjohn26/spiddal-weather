name: Isolated GEFS 0.5-degree diagnostic

on:
  push:
    branches:
      - diagnostic-gefs05-15day
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-gefs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Test 15-day GEFS 0.5-degree availability
        run: python diagnostics/gefs05_coverage.py
