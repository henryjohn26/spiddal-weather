name: Extended ensemble 15-day test
on:
  push:
    branches: [extended-ensemble-15day]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -p 'test_ensemble_analysis.py'
      - run: python ensemble_analysis.py
      - name: Verify extended coverage and preserve other models
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/ensemble_latest.json').read_text())
          for name in ('ECMWF IFS','GFS GEFS'):
              m=d['models'][name]
              assert m['status']=='ok', (name,m.get('error'))
              coverage=m['coverage']
              usable=coverage['rain_mm']['usable_days']
              minimum={'ECMWF IFS':13,'GFS GEFS':9}[name]
              assert usable>=minimum, (name,'usable days',usable,'minimum',minimum)
              assert coverage['returned_hourly_steps']>=24*10, (name,'hourly steps',coverage)
              assert coverage['rain_mm']['last_usable_date'] is not None
              assert coverage['max_gust_kmh']['usable_days']>=minimum, (name,'gust coverage',coverage)
              print(name,'requested',m['forecast_days_requested'],'days; returned',coverage['returned_calendar_dates'],
                    'calendar dates; usable rain',usable,'days; usable gust',
                    coverage['max_gust_kmh']['usable_days'],'days; last rain date',
                    coverage['rain_mm']['last_usable_date'],'; unusable dates',
                    coverage['rain_mm']['unusable_dates'])
          for name,m in d['models'].items():
              if name not in ('ECMWF IFS','GFS GEFS'):
                  assert m['forecast_days_requested']==7
          print('Extended ensemble validation passed')
          PY
