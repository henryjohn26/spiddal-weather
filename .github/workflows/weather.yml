name: Spiddal Weather Update

on:
  workflow_dispatch:
  schedule:
    - cron: '15 6,12,18 * * *'

permissions:
  contents: write

jobs:
  update-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Generate weather forecast
        run: python forecast.py

      - name: Generate ensemble analysis
        run: python ensemble_analysis.py

      - name: Save updated forecast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/latest.json data/ensemble_latest.json
          git diff --cached --quiet || git commit -m "Update weather forecast"
          git push
